<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Lab 06 architecture: MCP clients, MCP servers, shared LLM layer</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44505c"/>
    </marker>
    <style>
      .band-label { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .box-title { font-size: 15px; font-weight: 700; fill: #1f2328; text-anchor: middle; }
      .box-text { font-size: 12px; fill: #3d4751; text-anchor: middle; }
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .edge-label { font-size: 11px; fill: #44505c; text-anchor: middle; }
      .edge { stroke: #44505c; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">CS3235 Lab 06 - MCP Architecture</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#57606a">Host apps run an LLM tool-calling loop and talk to FastMCP servers over stdio (JSON-RPC)</text>

  <!-- ===== Experiment 1 band ===== -->
  <rect x="20" y="76" width="960" height="172" rx="12" fill="#eef4ff" stroke="#9db8e8"/>
  <text x="36" y="98" class="band-label">Experiment 1 - "Personal Assistant" Memory Server</text>

  <rect x="40" y="116" width="120" height="100" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="1.4"/>
  <text x="100" y="158" class="box-title">User</text>
  <text x="100" y="178" class="box-text">terminal</text>

  <rect x="220" y="116" width="190" height="100" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
  <text x="315" y="146" class="box-title">MCP client (host)</text>
  <text x="315" y="168" class="box-text mono">notes_client.py</text>
  <text x="315" y="188" class="box-text">Rich CLI, --demo / --query</text>

  <rect x="500" y="116" width="200" height="100" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
  <text x="600" y="146" class="box-title">MCP server (FastMCP)</text>
  <text x="600" y="168" class="box-text mono">notes_server.py</text>
  <text x="600" y="188" class="box-text">save / search / list /</text>
  <text x="600" y="204" class="box-text">update / delete note</text>

  <rect x="790" y="116" width="170" height="100" rx="10" fill="#fff8e6" stroke="#c9a227" stroke-width="1.4"/>
  <text x="875" y="158" class="box-title">Local storage</text>
  <text x="875" y="180" class="box-text mono">notes.json</text>
  <text x="875" y="198" class="box-text">(NOTES_FILE)</text>

  <line x1="160" y1="166" x2="218" y2="166" class="edge" marker-end="url(#arrow)"/>
  <text x="189" y="158" class="edge-label">query</text>

  <line x1="412" y1="166" x2="498" y2="166" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="455" y="150" class="edge-label">MCP stdio</text>
  <text x="455" y="184" class="edge-label">call_tool</text>

  <line x1="700" y1="166" x2="788" y2="166" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="744" y="158" class="edge-label">read / write</text>

  <!-- ===== Shared layer band ===== -->
  <rect x="20" y="270" width="960" height="150" rx="12" fill="#f6f8fa" stroke="#c4ccd4"/>
  <text x="36" y="292" class="band-label">Shared layer</text>
  <text x="36" y="316" font-size="12" fill="#57606a">used by both</text>
  <text x="36" y="332" font-size="12" fill="#57606a">host apps</text>

  <rect x="220" y="300" width="190" height="100" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="1.6"/>
  <text x="315" y="324" class="box-title mono" font-size="14">common/</text>
  <text x="315" y="346" class="box-text mono">agent_loop.py</text>
  <text x="315" y="364" class="box-text mono">mcp_tools.py</text>
  <text x="315" y="382" class="box-text mono">llm.py</text>

  <rect x="500" y="300" width="460" height="100" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/>
  <text x="730" y="326" class="box-title">LLM backend (auto-selected, OpenAI-style function calling)</text>
  <text x="730" y="350" class="box-text">1. OPENAI_API_KEY (+ OPENAI_BASE_URL / OPENAI_MODEL)</text>
  <text x="730" y="368" class="box-text">2. GROQ_API_KEY   3. GOOGLE_API_KEY / GEMINI_API_KEY</text>
  <text x="730" y="386" class="box-text">4. fallback: keyless Pollinations (gpt-oss-20b), zero setup</text>

  <line x1="412" y1="350" x2="498" y2="350" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="455" y="342" class="edge-label">messages</text>
  <text x="455" y="368" class="edge-label">+ tool schemas</text>

  <line x1="315" y1="216" x2="315" y2="298" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="324" y="262" class="edge-label" style="text-anchor:start">tool-calling loop</text>

  <line x1="315" y1="402" x2="315" y2="480" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="324" y="415" class="edge-label" style="text-anchor:start">events: thinking / tool_call / tool_result / answer</text>

  <!-- ===== Experiment 2 band ===== -->
  <rect x="20" y="442" width="960" height="172" rx="12" fill="#eefaf1" stroke="#8fcca0"/>
  <text x="36" y="600" class="band-label">Experiment 2 - "Data Dashboard" Connector</text>

  <rect x="40" y="482" width="120" height="100" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="1.4"/>
  <text x="100" y="524" class="box-title">User</text>
  <text x="100" y="544" class="box-text">web browser</text>

  <rect x="220" y="482" width="190" height="100" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="315" y="512" class="box-title">MCP client (host)</text>
  <text x="315" y="534" class="box-text mono">app.py</text>
  <text x="315" y="554" class="box-text">Streamlit, live step trace</text>

  <rect x="500" y="482" width="200" height="100" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="600" y="512" class="box-title">MCP server (FastMCP)</text>
  <text x="600" y="534" class="box-text mono">weather_server.py</text>
  <text x="600" y="554" class="box-text">current / forecast /</text>
  <text x="600" y="570" class="box-text">compare weather</text>

  <rect x="790" y="482" width="170" height="100" rx="10" fill="#fff8e6" stroke="#c9a227" stroke-width="1.4"/>
  <text x="875" y="514" class="box-title">External APIs</text>
  <text x="875" y="536" class="box-text mono">wttr.in</text>
  <text x="875" y="552" class="box-text">+ Open-Meteo geocoding</text>
  <text x="875" y="570" class="box-text">real-time, free, no key</text>

  <line x1="160" y1="532" x2="218" y2="532" class="edge" marker-end="url(#arrow)"/>
  <text x="189" y="524" class="edge-label">question</text>

  <line x1="412" y1="532" x2="498" y2="532" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="455" y="516" class="edge-label">MCP stdio</text>
  <text x="455" y="550" class="edge-label">call_tool</text>

  <line x1="700" y1="532" x2="788" y2="532" class="edge" marker-end="url(#arrow)"/>
  <text x="744" y="524" class="edge-label">HTTPS GET</text>
  <text x="744" y="550" class="edge-label">format=j1</text>

  <!-- ===== Legend ===== -->
  <text x="500" y="648" text-anchor="middle" font-size="12" fill="#57606a">The LLM only sees tool names, docstrings and JSON-Schema parameters (from MCP list_tools); it decides which tool to call.</text>
  <text x="500" y="668" text-anchor="middle" font-size="12" fill="#57606a">The host executes the call on the MCP server and feeds the result back to the LLM for the final answer.</text>
</svg>
